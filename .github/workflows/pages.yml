name: Publish 3D exploration site

on:
  push:
    branches: [main]
    paths:
      - projects/knowledge-tower/**
      - projects/site/**
      - projects/courtyard/**
      - projects/shunde/**
      - projects/tsinghua-campus/**
      - projects/wind-print/**
      - shared/**
      - package.json
      - package-lock.json
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix projects/tsinghua-campus ci --ignore-scripts
      - run: npm run test:knowledge
      - run: npm run test:wind
      - name: Check campus reconstruction invariants
        run: >-
          node --test
          projects/tsinghua-campus/tests/modern-buildings.test.mjs
          projects/tsinghua-campus/tests/refinements.test.mjs
          projects/tsinghua-campus/tests/inspection-view.test.mjs
          projects/tsinghua-campus/tests/model.test.mjs
          projects/tsinghua-campus/tests/surface-materials.test.mjs
          projects/tsinghua-campus/tests/landscape.test.mjs
          projects/tsinghua-campus/tests/campus-trees.test.mjs
          projects/tsinghua-campus/tests/biology-hall.test.mjs
          projects/tsinghua-campus/tests/sem-refinement.test.mjs
          projects/shunde/src/sem-building.test.js
          projects/tsinghua-campus/tests/zijing.test.mjs
          projects/tsinghua-campus/tests/zijing-dining.test.mjs
          projects/tsinghua-campus/tests/coverage.test.mjs
          projects/tsinghua-campus/tests/campus-architecture.test.mjs
          projects/tsinghua-campus/tests/photo-appearance.test.mjs
          projects/tsinghua-campus/tests/reference-catalog.test.mjs
          projects/courtyard/src/glass-reflections.test.js
          projects/courtyard/src/leaves.test.js
      - run: npm run test:pages
      - run: npm run build:pages
      - name: Update Pages branch
        working-directory: output/pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!gh auth git-credential'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch origin gh-pages
          git reset --soft FETCH_HEAD
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish 3D exploration site" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
