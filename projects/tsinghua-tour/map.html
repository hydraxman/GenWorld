function atDistance(d){let i=0;while(i<route.cumulative_m.length-2&&route.cumulative_m[i+1]<d)i++;const den=route.cumulative_m[i+1]-route.cumulative_m[i],u=Math.max(0,Math.min(1,(d-route.cumulative_m[i])/den));return {point:route.coordinates[i].map((v,k)=>mix(v,route.coordinates[i+1][k],u)),i}}
