<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>庭院3D模型 · 交互查看</title><style>*{box-sizing:border-box}body{margin:0;background:#d9dfd3;color:#28362c;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1600px;margin:24px auto;padding:0 24px}h1{font-size:24px;margin:0 0 8px}p{font-size:14px}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#c8dbe2;border-radius:8px}nav{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}button{border:1px solid #899b87;padding:10px 18px;background:#f2f2e9;color:#28362c;border-radius:5px;cursor:pointer}small{display:block;line-height:1.8}</style></head><body data-viewer="true"><main><h1>庭院建筑 · 三维外观模型</h1><p>拖动旋转，滚轮缩放，右键拖动平移。</p><canvas id="scene" width="1920" height="1080"></canvas><nav><button data-shot="0">正面</button><button data-shot="10">斜侧</button><button data-shot="18">廊下</button><button data-shot="25">立面</button><button data-shot="32">俯瞰</button><button data-shot="40.5">分层展开</button><button data-shot="45.5">收拢复原</button><button id="download">下载 GLB 模型</button></nav><small>根据两张实景照片进行外观近似重建，非测绘模型；新增室内布局及承重构造为推测示意，不用于工程设计。点击“分层展开”可查看简化内部，随后可点击“收拢复原”。</small></main><script src="assets/scene.js"></script></body></html>
